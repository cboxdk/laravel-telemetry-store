name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: pint · phpstan · pest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This package resolves cboxdk/laravel-telemetry-ui via a sibling path
      # repository, so check both out next to each other under the workspace.
      - name: Checkout store
        uses: actions/checkout@v6
        with:
          path: laravel-telemetry-store

      - name: Checkout telemetry-ui (sibling)
        uses: actions/checkout@v6
        with:
          repository: cboxdk/laravel-telemetry-ui
          ref: main
          path: laravel-telemetry-ui

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, intl, fileinfo
          coverage: none

      - name: Install dependencies
        working-directory: laravel-telemetry-store
        run: composer update --prefer-dist --no-interaction

      - name: Pint
        working-directory: laravel-telemetry-store
        run: vendor/bin/pint --test

      - name: PHPStan
        working-directory: laravel-telemetry-store
        run: vendor/bin/phpstan --error-format=github --memory-limit=1G

      # Start ClickHouse on :18123 so the tests/E2E suite runs (it gates on
      # reachability). The override opens the default user to the runner.
      - name: Start ClickHouse
        run: |
          docker run -d --name ch -p 18123:8123 --ulimit nofile=262144:262144 \
            -v "$GITHUB_WORKSPACE/laravel-telemetry-store/.github/clickhouse/open.xml:/etc/clickhouse-server/users.d/open.xml:ro" \
            clickhouse/clickhouse-server:24.8
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:18123/?query=SELECT%201" >/dev/null; then echo "ClickHouse ready"; exit 0; fi
            sleep 1
          done
          echo "ClickHouse did not become ready"; docker logs ch; exit 1

      - name: Pest (unit, feature + E2E vs ClickHouse)
        working-directory: laravel-telemetry-store
        run: vendor/bin/pest --ci
